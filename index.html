@keyframes heroFadeUp {
  0% { opacity: 0; transform: translateY(24px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 0 rgba(38, 88, 206, 0); }
  50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 14px rgba(38, 88, 206, 0.65); }
}
@keyframes badgePop {
  0% { transform: scale(1); }
  45% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.brand i {
  animation: pulseDot 3s infinite ease-in-out;
  border-radius: 50%;
}
.hero-copy h1 {
  animation: heroFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.hero-copy .hero-desc {
  animation: heroFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
}
.hero-copy .actions {

n 2026 with acrylics, UV-reactive and phosphorescent pigments, it glows under blacklight, radiates in complete darkness ✨, and comes alive through an augmented reality experience 📲. \nThis time the Artonaut is no longer just an explorer — he is a statement. A massive black figure, grounded and unapologetically present, sitting in a relaxed pose that feels both powerful and detached. Covered in chaotic layers of graffiti, symbols, and personal marks, the suit becomes a direct extension of the artist himself 🎨. \nThis piece is about self-expression pushed to its extreme — where identity becomes louder than the world around it 🔊. It reflects the raw, unfiltered feeling of ego: not hidden, not softened, but amplified. The Artonaut doesn’t try to fit in — he occupies space, dominates it, and redefines it 🌌. \nThe contrast between the deep black form and the explosive neon energy intensifies this idea: silence versus noise, control versus chaos, ego versus everything else. \nYet beneath this bold presence lies the ongoing mission of the series — a call for peace ☮️, nuclear disarmament, and the triumph of art over war. Because even ego, at its highest intensity, still seeks meaning beyond itself. \n#Artonaut #MarkRox #UrbanArt #StreetArt #GraffitiArt #UVart #ARart #Ego #SelfExpression #ContemporaryArt","descriptionRu":"the nineteenth chapter in Mark Rox’s cult Artonaut series and the largest work by surface area to date. Created in 2026 with acrylics, UV-reactive and phosphorescent pigments, it glows under blacklight, radiates in complete darkness ✨, and comes alive through an augmented reality experience 📲. \nThis time the Artonaut is no longer just an explorer — he is a statement. A massive black figure, grounded and unapologetically present, sitting in a relaxed pose that feels both powerful and detached. Covered in chaotic layers of graffiti, symbols, and personal marks, the suit becomes a direct extension of the artist himself 🎨. \nThis piece is about self-expression менного мегаполиса.","images":["https://www.artevistas.eu/wp-content/uploads/2026/09/Mark-Rox-Car-Garbage-Pile-Grande.jpeg","https://www.artevistas.eu/wp-content/uploads/2026/09/Mark-Rox-Car-Garbage-Pile-web.jpg"],"sku":"CUMROX3518","tags":["Painting","Industrial","Pop Art"],"sourceUrl":"https://www.artevistas.eu/product/mark-rox-car-garbage-pile/","featured":false,"published":true,"version":1},{"id":"untitled-portal-fragment","title":"Untitled (Portal Fragment)","category":"painting","availability":"available","price":8000,"year":2026,"dimensions":"200 × 200 cm","mediumEn":"Mixed media on canvas","mediumRu":"Смешанная техника на холсте","descriptionEn":"Mark Rox, 2024 \nSpray paint, acrylic, graffiti technique on custom engineered material \nApprox. 200 × 200 cm \nThis large-scale street art piece by Mark Rox explores the illusion of depth through a meticulously constructed visual “portal” carved into a fractured architectural surface. Executed in a refined spray paint and acrylic graffiti technique, the work merges sharp geometric structure with fluid chromatic transitions, creating a hypnotic passage that appears to extend infinitely beyond the wall. \nProduced on a specially engineered material, this piece exists as a high-end street art sticker — a format that bridges the raw language of urban art with the flexibility of contemporary installation. It can be mounted directly onto walls using a dedicated adhesive system, allowing for both temporary and permanent placement without compromising visual integrity. \nBalancing precision and spontaneity, Mark Rox transforms a flat surface into a dimensional experience, inviting the viewer to step into a constructed reality where graffiti evolves beyond surface intervention into spatial illusion.","descriptionRu":"Mark Rox, 2024 \nSpray paint, acrylic, graffiti technique on custom engineered material \nApprox. 200 × 200 cm \nThis large-scale street art piece by Mark Rox explores the illusion of depth through a meticulously constructed visual “portal” carved into a fractured architectural surface. Executed in a refined spray paint and acrylic graffiti technique, the work merges sharp geometric structure with fluid chromatic transitions, creating a hypnotic passage that appears to extend infinitely beyond the wall. \nProduced on a specially engineered material, this piece exists as a high-end street art sticker — a format that bridges the raw language of urban art with the flexibility of contemporary installation. It can be mounted directly onto walls using a dedicated adhesive system, allowing for both temporary and permanent placement without compromising visual integrity. \nBalancing precision and spontaneity, Mark Rox transforms a flat surface into a dimensional experience, inviting the viewer to step into a constructed reality where graffiti evolves beyond surface intervention into spatial illusion.","images":["https://static.tildacdn.one/stor3566-6134-4739-b438-663336633931/c0308aa361d1f52ae5830d0b95bfe83c.jpg","https://static.tildacdn.one/stor3431-6265-4865-b063-616131326537/f467996051ab62c831e9f433c3d14090.jpg","https://static.tildacdn.one/stor6666-3835-4731-a639-313431303136/44c79900680de16b2e6c9f3b202d7394.jpg","https://static.tildacdn.one/stor3666-3035-4438-a262-613161616265/6df3e50a2d98430d159cd1758fc7a86f.jpg","https://static.tildacdn.one/stor6234-6631-4935-a564-316363366665/79042e8d4404eee9acf91b260f1c9917.jpg"],"sku":"TIL-YLYFK45D","tags":["Painting","Pop Art","UV"],"sourceUrl":"https://markrox.art/tproduct/217962003684-untitled-portal-fragment","featured":false,"published":true,"version":1},{"id":"gravity-doesn-t-exist","title":"Gravity Doesn’t Exist","category":"painting","availability":"available","price":7500,"year":2026,"dimensions":"150 × 100 cm","mediumEn":"Mixed media on canvas","mediumRu":"Смешанная техника на холсте","descriptionEn":"A powerful standalone work by Mark Rox, created in 2025 for the MOSS Foundation Skaters — a volunteer-driven initiative that builds permanent clean water systems for communities in Africa. \nExecuted in oil and UV-reactive acrylics across six skateboard decks, the piece transforms recycled skate surfaces into a unified visual narrative — merging fine art, street culture, and social impact into a single object. \nAt the center, a drifting astronaut collides with the language of skateboarding — not floating in space, but suspended between motion and meaning. The skateboard becomes a global symbol: youth, freedom, rebellion — and now, responsibility. \nThis work exists beyond the Artonaut series, stepping into reality — where art is no longer just expression, but action. \nThe project is part of the MOSS Skate Art Exhibition, where over 90 artists reimagined skateboard decks as artworks, all contributing to a collective mission: raising funds for clean water infrastructure in Africa. \nThe tension within the piece is subtle but powerful: \nwhile the figure floats in weightlessness, millions remain bound by the absence of something as fundamental as clean water. \n✨ Exhibited at Palo Alto Barcelona as part of the MOSS exhibition \n💧 Proceeds from the sale of this artwork contribute to building water wells in Africa \n📲 Learn more: mossfoundationskaters \n#MarkRox #MOSSFoundation #ArtForChange #SkateArt #ContemporaryArt #StreetArt #UrbanArt #Africa #WaterForLife #ArtWithPurpose","descriptionRu":"A powerful standalone work by Mark Rox, created in 2025 for the MOSS Foundation Skaters — a volunteer-driven initiative that builds permanent clean water systems for communities in Africa. \nExecuted in oil and UV-reactive acrylics across six skateboard decks, the piece transforms recycled skate surfaces into a unified visual narrative — merging fine art, street culture, and social impact into a single object. \nAt the center, a drifting astronaut collides with the language of skateboarding — not floating in space, but suspended between motion and meaning. The skateboard becomes a global symbol: youth, freedom, rebellion — and now, responsibility. \nThis work exists beyond the Artonaut series, stepping into reality — where art is no longer just expression, but action. \nThe project is part of the MOSS Skate Art Exhibition, where over 90 artists reimagined skateboard decks as artworks, all contributing to a collective mission: raising funds for clean water infrastructure in Africa. \nThe tension within the piece is subtle but powerful: \nwhile the figure floats in weightlessness, millions remain bound by the absence of something as fundamental as clean water. \n✨ Exhibited at Palo Alto Barcelona as part of the MOSS exhibition \n💧 Proceeds from the sale of this artwork contribute to building water wells in Africa \n📲 Learn more: mossfoundationskaters \n#MarkRox #MOSSFoundation #ArtForChange #SkateArt #ContemporaryArt #StreetArt #UrbanArt #Africa #WaterForLife #ArtWithPurpose","images":["https://static.tildacdn.one/stor6130-6434-4162-a634-363638313430/e5b750433bb58132a4fc9657362dd0a2.jpg","https://static.tildacdn.one/stor3665-6232-4764-a534-643165336637/a9ff78a5ca84f977eb567a47feecb4a2.jpg","https://static.tildacdn.one/stor6233-6131-4430-b831-666665623034/55122cc976c8840a746a26ee53c6f59b.jpg","https://static.tildacdn.one/stor6438-3937-4338-a336-363839396331/5affdce12621a03d24643cee1c6a6b4d.jpg","https://static.tildacdn.one/stor3663-3531-4465-b632-333839336434/bb0bbadc92eb7e66a0fc85e35c86469a.jpg","https://static.tildacdn.one/stor3137-3932-4530-b232-343739626563/243033f5f5479fe5e9d1d10b2aa916b8.jpg","https://static.tildacdn.one/stor6137-3866-4064-a333-653736356438/8fe39e6c90566c1324efef396da83299.jpg"],"sku":"TIL-JJJS6M97","tags":["Painting","Pop Art","UV"],"sourceUrl":"https://markrox.art/tproduct/783173197234-gravity-doesnt-exist","featured":false,"published":true,"version":1},{"id":"mermaid","title":"Mermaid","category":"painting","availability":"available","price":6500,"year":2026,"dimensions":"150 × 100 cm","mediumEn":"Mixed media on canvas","mediumRu":"Смешанная техника на холсте","descriptionEn":"Oil on canvas. Mark Rox, Castelldefels, Catalunya, 2024. \n\nIn this work, Mark Rox turns to the image of the mermaid as a symbol of the inner world — a threshold between reality and myth, serenity and unrest. The figure of the mythological woman, captured in a moment of sleep or meditation, becomes a metaphor for the artist’s emotional state during his time living on the Catalan coast. \n\nWhile residing in Castelldefels, Rox was in daily dialogue with the vastness of the sea — an experience reflected in the palette. Dominated by aquamarine, emerald, and muted ochre tones, the composition conveys a sense of depth and tranquility.","descriptionRu":"Oil on canvas. Mark Rox, Castelldefels, Catalunya, 2024. \n\nIn this work, Mark Rox turns to the image of the mermaid as a symbol of the inner world — a threshold between reality and myth, serenity and unrest. The figure of the mythological woman, captured in a moment of sleep or meditation, becomes a metaphor for the artist’s emotional state during his time living on the Catalan coast. \n\nWhile residing in Castelldefels, Rox was in daily dialogue with the vastness of the sea — an experience reflected in the palette. Dominated by aquamarine, emerald, and muted ochre tones, the composition conveys a sense of depth and tranquility.","images":["https://static.tildacdn.one/stor3330-3462-4764-a532-633963633562/aa3a3f79b2f57bd13fbef524471d9b81.jpg","https://static.tildacdn.one/stor3061-3135-4733-a236-643731323463/d804e2e57294be444734d4c3a13ece0d.png","https://static.tildacdn.one/stor3438-6165-4362-b034-396237643661/b1d36db772ef0f24913e8faaf9c40575.jpg","https://static.tildacdn.one/stor3334-3362-4239-b736-643534633231/b8996bca71ace34e4bc63cd0334c6846.jpg"],"sku":"TIL-JBJVLZMH","tags":["Painting","Pop Art","UV"],"sourceUrl":"https://markrox.art/tproduct/455504598184-mermaid","featured":false,"published":true,"version":1},{"id":"kaleidoscope","title":"Kaleidoscope","category":"painting","avail k Rox’s Artonaut series. Created in acrylics with UV-reactive pigments, it glows under blacklight and, like every work in the series, comes alive through an AR experience.\n\nThis time, the artist strips the palette down to pure essentials: black, white, and red. The limited colors intensify the contrasts, making the Artonaut appear as if he’s leaping out of a graphic novel or a street mural set loose in space. Despite the restriction, the energy is multiplied — every line and every splash of red vibrates with movement.\n\nBy merging raw graffiti codes, futuristic symbolism, and the timeless figure of the space traveler, Artonaut #13 becomes both a visual explosion and a distilled essence of the series.\n\n#Artonaut #MarkRox #UrbanArt #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n73x92cm","descriptionRu":"“Artonaut #13” — the thirteenth chapter in Mark Rox’s Artonaut series. Created in acrylics with UV-reactive pigments, it glows under blacklight and, like every work in the series, comes alive through an AR experience.\n\nThis time, the artist strips the palette down to pure essentials: black, white, and red. The limited colors intensify the contrasts, making the Artonaut appear as if he’s leaping out of a graphic novel or a street mural set loose in space. Despite the restriction, the energy is multiplied — every line and every splash of red vibrates with movement.\n\nBy merging raw graffiti codes, futuristic symbolism, and the timeless figure of the space traveler, Artonaut #13 becomes both a visual explosion and a distilled essence of the series.\n\n#Artonaut #MarkRox #UrbanArt #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n73x92cm","images":["https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-13-01-510x906.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-13-01-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-13-02-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-13-03-scaled.jpg","https://static.tildacdn.one/stor3866-6138-4466-a237-656538313961/18081610.jpg","https://static.tildacdn.one/stor3166-6566-4961-a234-373461643230/76386583.jpg","https://static.tildacdn.one/stor3738-6432-4433-b562-663735663637/96605653.jpg","https://static.tildacdn.one/stor3364-6262-4064-b235-633337303334/82488116.png","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-13-01-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-13-02-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-13-03-scaled.jpg"],"sku":"ESMROX2549","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://www.artevistas.eu/product/mark-rox-artonaut-13-02/","featured":false,"published":true,"version":1},{"id":"artonaut-12-01","title":"ARTonaut #12 01","category":"sculpture","availability":"available","price":2800,"year":2026,"dimensions":"38 x 22 x 24 cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"🌍 “Artonaut #12” — the twelfth work in Mark Rox’s Artonaut series, created in acrylic with UV-reactive pigments that come to life under blacklight, revealing hidden details and enhancing the visible ones. Like all pieces in the series, it can be brought to life through AR.\n\nIn reality, an astronaut is a tiny figure adrift in the vastness of space, with Earth appearing as a massive and dominant presence. In this piece, however, Mark Rox inverts that perspective: the planet becomes small and fragile, while the Artonaut is rendered monumental, almost sculptural. He sits as if resting after a long journey, watching the miniature Earth float in the void.\n\nThis shift in scale creates the sensation of peering into a world where the familiar laws of space and the roles we assign are reversed — a place where the artist plays with our perception of reality itself.\n\n#Artonaut #MarkRox #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n130x97cm","descriptionRu":"🌍 “Artonaut #12” — the twelfth work in Mark Rox’s Artonaut series, created in acrylic with UV-reactive pigments that come to life under blacklight, revealing hidden details and enhancing the visible ones. Like all pieces in the series, it can be brought to life through AR.\n\nIn reality, an astronaut is a tiny figure adrift in the vastness of space, with Earth appearing as a massive and dominant presence. In this piece, however, Mark Rox inverts that perspective: the planet becomes small and fragile, while the Artonaut is rendered monumental, almost sculptural. He sits as if resting after a long journey, watching the miniature Earth float in the void.\n\nThis shift in scale creates the sensation of peering into a world where the familiar laws of space and the roles we assign are reversed — a place where the artist plays with our perception of reality itself.\n\n#Artonaut #MarkRox #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n130x97cm","images":["https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-12-01-1-510x906.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-12-01-1-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-12-02-1-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-12-03-scaled.jpg","https://static.tildacdn.one/stor6366-3030-4133-a263-393030363861/605b917988a8d6423bb10c7f42c77697.png","https://static.tildacdn.one/stor3461-6238-4435-a537-646135333232/16265575.jpg","https://static.tildacdn.one/stor3362-6266-4435-b636-373030303639/87980788.jpg","https://static.tildacdn.one/stor3338-3236-4636-b232-373363356132/63849478.png","https://static.tildacdn.one/stor6265-6334-4163-b466-316165363035/95585769.png"],"sku":"ESMROX2548","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://www.artevistas.eu/product/mark-rox-artonaut-12-01/","featured":false,"published":true,"version":1},{"id":"artonaut-11-01","title":"ARTonaut #11 01","category":"sculpture","availability":"available","price":2800,"year":2026,"dimensions":"38 x 22 x 24 cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"2025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #11 is the eleventh piece in Mark Rox’s iconic Artonauts series.\nThis time, the spotlight is on a female figure — bold, empowered, and intuitive. Her vibrant astronaut suit becomes a symbol of inner freedom, creative chaos, and fearless self-expression.\n\nEvery element of the suit blends street art, neon color schemes, and hidden symbols. The palette is intentionally loud; the posture dynamic and unapologetic — as if to say: “I’m here. I move. I am art.”\n\nLike the rest of the series, this painting glows under UV light, revealing hidden messages and visual elements that remain invisible in normal lighting.\n\nThrough the AR app, the artwork comes to life — adding a digital layer that opens up an interactive, augmented reality experience.\n\n130x97","descriptionRu":"2025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #11 is the eleventh piece in Mark Rox’s iconic Artonauts series.\nThis time, the spotlight is on a female figure — bold, empowered, and intuitive. Her vibrant astronaut suit becomes a symbol of inner freedom, creative chaos, and fearless self-expression.\n\nEvery element of the suit blends street art, neon color schemes, and hidden symbols. The palette is intentionally loud; the posture dynamic and unapologetic — as if to say: “I’m here. I move. I am art.”\n\nLike the rest of the series, this painting glows under UV light, revealing hidden messages and visual elements that remain invisible in normal lighting.\n\nThrough the AR app, the artwork comes to life — adding a digital layer that opens up an interactive, augmented reality experience.\n\n130x97","images":["https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-11-01-510x906.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-11-01-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-11-02-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-–-ARTonaut-11-03-scaled.jpg","https://static.tildacdn.one/stor3237-3739-4232-a332-386466313731/7c1b7a57eb92b5cac553c29a69ff3e26.png","https://static.tildacdn.one/stor6133-3331-4639-a539-636232373836/64193884.jpg","https://static.tildacdn.one/stor6230-6466-4465-a130-313734353137/70994575.jpg","https://static.tildacdn.one/stor3932-3065-4138-b762-613364653436/72605701.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-11-01-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-11-02-scaled.jpg","https://www.artevistas.eu/wp-content/uploads/2026/07/Mark-Rox-%E2%80%93-ARTonaut-11-03-scaled.jpg"],"sku":"ESMROX2547","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://www.artevistas.eu/product/mark-rox-artonaut-11-01/","featured":false,"published":true,"version":1},{"id":"artonaut-9","title":"Artonaut #9","category":"sculpture","availability":"sold","price":null,"year":2026,"dimensions":"195x130cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"🚀 “Artonaut #9” — when street art goes interstellar.\nThe ninth chapter in Mark Rox’s iconic Artonaut series — painted in acrylics, charged with UV-reactive pigments, and ready to glow under blacklight, revealing hidden codes and symbols. 🔥\n\n🐎 This is the only piece in the series featuring an animal — a full-power graffiti horse carrying an Artonaut in a riot of colors, tags, and futuristic vibes.\nSecond-largest in the series, this work fuses the eternal image of the rider with the pulse of street culture and a sci-fi edge.\n\n✨ Activate it through AR, and watch the scene break out of the frame.\nNot just art. A journey.\n\n#Artonaut #MarkRox #UrbanArt #StreetArt #GraffitiArt #ARart #Futurism #ContemporaryArt #UVart\n\n195x130cm","descriptionRu":"🚀 “Artonaut #9” — when street art goes interstellar.\nThe ninth chapter in Mark Rox’s iconic Artonaut series — painted in acrylics, charged with UV-reactive pigments, and ready to glow under blacklight, revealing hidden codes and symbols. 🔥\n\n🐎 This is the only piece in the series featuring an animal — a full-power graffiti horse carrying an Artonaut in a riot of colors, tags, and futuristic vibes.\nSecond-largest in the series, this work fuses the eternal image of the rider with the pulse of street culture and a sci-fi edge.\n\n✨ Activate it through AR, and watch the scene break out of the frame.\nNot just art. A journey.\n\n#Artonaut #MarkRox #UrbanArt #StreetArt #GraffitiArt #ARart #Futurism #ContemporaryArt #UVart\n\n195x130cm","images":["https://static.tildacdn.one/stor3136-3634-4561-b665-366365663963/6e69b1d7610bb46c2f16b89b761ef687.png","https://static.tildacdn.one/stor3461-6635-4361-b466-366564616239/43013574.jpg","https://static.tildacdn.one/stor6536-6232-4333-b564-356633306361/15288195.jpg","https://static.tildacdn.one/stor6330-3035-4236-a138-386530393138/11697929.png","https://static.tildacdn.one/stor3762-6332-4166-a439-303832643663/31519215.jpg"],"sku":"TIL-4VUSVAJP","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://markrox.art/tproduct/801636227032--artonaut-9","featured":true,"published":true,"version":1},{"id":"artonaut-lazy-genius","title":"ARTonaut #Lazy genius","category":"sculpture","availability":"sold","price":40000,"year":2026,"dimensions":"38 x 22 x 24 cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"A sculptural work from the ARTonaut collection, made with mixed media on acrylic cement. Explore the object from different angles mark-rox-graffiti-giraffe/","featured":false,"published":true,"version":1},{"id":"mark-rox-artonaut-10","title":"Mark Rox – Artonaut #10","category":"sculpture","availability":"sold","price":8500,"year":2026,"dimensions":"130x97cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #10 is the tenth piece in Mark Rox’s iconic Artonauts series and the first part of a diptych, continued in Artonaut #11.\nThe painting features a female artonaut stepping forward with bold energy and purpose. Her suit is a vibrant fusion of street art, graffiti, symbols, and color — a celebration of freedom, movement, and the strength of creative identity.\n\nThe reflection in her helmet visor adds emotional depth, as if we’re catching a glimpse of her world through her own eyes — a moment of quiet power.\n\nJust like the rest of the series, this piece glows under UV light, revealing hidden layers and messages that remain invisible under regular lighting. It speaks to the complexity of identity — what’s visible versus what’s hidden within.\n\nWith the AR app, the painting comes to life — adding a dynamic digital layer that expands the viewer’s experience into the realm of augmented reality.\n\n130x97cm","descriptionRu":"025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #10 is the tenth piece in Mark Rox’s iconic Artonauts series and the first part of a diptych, continued in Artonaut #11.\nThe painting features a female artonaut stepping forward with bold energy and purpose. Her suit is a vibrant fusion of street art, graffiti, symbols, and color — a celebration of freedom, movement, and the strength of creative identity.\n\nThe reflection in her helmet visor adds emotional depth, as if we’re catching a glimpse of her world through her own eyes — a moment of quiet power.\n\nJust like the rest of the series, this piece glows under UV light, revealing hidden layers and messages that remain invisible under regular lighting. It speaks to the complexity of identity — what’s visible versus what’s hidden within.\n\nWith the AR app, the painting comes to life — adding a dynamic digital layer that expands the viewer’s experience into the realm of augmented reality.\n\n130x97cm","images":["https://static.tildacdn.one/stor3332-3635-4130-b462-323766363061/4e3185a704e3b7fcc30182b68617ae09.png","https://static.tildacdn.one/stor6430-6135-4737-b432-336336376465/38430532.jpg","https://static.tildacdn.one/stor3061-3532-4437-b734-353466393937/73099680.jpg","https://static.tildacdn.one/stor3161-3533-4330-a465-303036343964/84818029.jpg"],"sku":"TIL-DS7Z2T6M","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://markrox.art/tproduct/545513063262--mark-rox-artonaut-10","featured":false,"published":true,"version":1},{"id":"mark-rox-artonaut-11","title":"Mark Rox – Artonaut #11","category":"sculpture","availability":"sold","price":null,"year":2026,"dimensions":"38 × 22 × 24 cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"2025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #11 is the eleventh piece in Mark Rox’s iconic Artonauts series.\nThis time, the spotlight is on a female figure — bold, empowered, and intuitive. Her vibrant astronaut suit becomes a symbol of inner freedom, creative chaos, and fearless self-expression.\n\nEvery element of the suit blends street art, neon color schemes, and hidden symbols. The palette is intentionally loud; the posture dynamic and unapologetic — as if to say: “I’m here. I move. I am art.”\n\nLike the rest of the series, this painting glows under UV light, revealing hidden messages and visual elements that remain invisible in normal lighting.\n\nThrough the AR app, the artwork comes to life — adding a digital layer that opens up an interactive, augmented reality experience.\n\n130x97","descriptionRu":"2025, canvas, acrylics, neon pigments, texture paste\n\nArtonaut #11 is the eleventh piece in Mark Rox’s iconic Artonauts series.\nThis time, the spotlight is on a female figure — bold, empowered, and intuitive. Her vibrant astronaut suit becomes a symbol of inner freedom, creative chaos, and fearless self-expression.\n\nEvery element of the suit blends street art, neon color schemes, and hidden symbols. The palette is intentionally loud; the posture dynamic and unapologetic — as if to say: “I’m here. I move. I am art.”\n\nLike the rest of the series, this painting glows under UV light, revealing hidden messages and visual elements that remain invisible in normal lighting.\n\nThrough the AR app, the artwork comes to life — adding a digital layer that opens up an interactive, augmented reality experience.\n\n130x97","images":["https://static.tildacdn.one/stor3237-3739-4232-a332-386466313731/7c1b7a57eb92b5cac553c29a69ff3e26.png","https://static.tildacdn.one/stor6133-3331-4639-a539-636232373836/64193884.jpg","https://static.tildacdn.one/stor6230-6466-4465-a130-313734353137/70994575.jpg","https://static.tildacdn.one/stor3932-3065-4138-b762-613364653436/72605701.jpg"],"sku":"TIL-ZPAMFRTY","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://markrox.art/tproduct/647532672632--mark-rox-artonaut-11","featured":false,"published":true,"version":1},{"id":"artonaut-12","title":"Artonaut #12","category":"sculpture","availability":"sold","price":null,"year":2026,"dimensions":"130x97cm","mediumEn":"Mixed media on acrylic cement","mediumRu":"Смешанная техника на акриловом цементе","descriptionEn":"🌍 “Artonaut #12” — the twelfth work in Mark Rox’s Artonaut series, created in acrylic with UV-reactive pigments that come to life under blacklight, revealing hidden details and enhancing the visible ones. Like all pieces in the series, it can be brought to life through AR.\n\nIn reality, an astronaut is a tiny figure adrift in the vastness of space, with Earth appearing as a massive and dominant presence. In this piece, however, Mark Rox inverts that perspective: the planet becomes small and fragile, while the Artonaut is rendered monumental, almost sculptural. He sits as if resting after a long journey, watching the miniature Earth float in the void.\n\nThis shift in scale creates the sensation of peering into a world where the familiar laws of space and the roles we assign are reversed — a place where the artist plays with our perception of reality itself.\n\n#Artonaut #MarkRox #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n130x97cm","descriptionRu":"🌍 “Artonaut #12” — the twelfth work in Mark Rox’s Artonaut series, created in acrylic with UV-reactive pigments that come to life under blacklight, revealing hidden details and enhancing the visible ones. Like all pieces in the series, it can be brought to life through AR.\n\nIn reality, an astronaut is a tiny figure adrift in the vastness of space, with Earth appearing as a massive and dominant presence. In this piece, however, Mark Rox inverts that perspective: the planet becomes small and fragile, while the Artonaut is rendered monumental, almost sculptural. He sits as if resting after a long journey, watching the miniature Earth float in the void.\n\nThis shift in scale creates the sensation of peering into a world where the familiar laws of space and the roles we assign are reversed — a place where the artist plays with our perception of reality itself.\n\n#Artonaut #MarkRox #StreetArt #GraffitiArt #UVart #ARart #Futurism #ContemporaryArt\n\n130x97cm","images":["https://static.tildacdn.one/stor6366-3030-4133-a263-393030363861/605b917988a8d6423bb10c7f42c77697.png","https://static.tildacdn.one/stor3461-6238-4435-a537-646135333232/16265575.jpg","https://static.tildacdn.one/stor3362-6266-4435-b636-373030303639/87980788.jpg","https://static.tildacdn.one/stor3338-3236-4636-b232-373363356132/63849478.png","https://static.tildacdn.one/stor6265-6334-4163-b466-316165363035/95585769.png","https://www.artevistas.eu/wp-content/uploads/2025/09/Mark-Rox-ARTonaut-12-Grande.jpeg","https://www.artevistas.eu/wp-content/uploads/2025/09/Mark-Rox-ARTonaut-12-web.jpg"],"sku":"TIL-N6EVYGUD","tags":["ARTonaut","Sculpture"],"sourceUrl":"https://markrox.art/tproduct/384499752102--artonaut-12","featured":false,"published":true,"version":1},{"id":"artonaut-18","title":"ARTonaut #18","category":"painting","availability":"sold","price":null,"year":2026,"dimensions":"162 × 130 × 2 cm","mediumEn":"Acrylics, neon pigments & texture paste on canvas","mediumRu":"Акрил, неоновые пигменты и текстурная паста на холсте","descriptionEn":"An astronaut and a bicycle meet in an impossible landscape. A familiar symbol of childhood and freedom enters a world of space and technology. UV-reactive pigments reveal another layer under ultraviolet light.","descriptionRu":"Астронавт и велосипед встречаются в невозможном пространстве. Знакомый символ детства и свободы оказывается в мире космоса и технологий. Под ультрафиолетом пигменты раскрывают дополнительный цветовой слой.","images":["https://www.artevistas.eu/wp-content/uploads/2026/04/Mark-Rox-ARTonaute-18-Grande.jpeg","https://www.artevistas.eu/wp-content/uploads/2026/04/Mark-Rox-ARTonaute-18-web-scaled.jpg"],"sku":"CUMROX3475","tags":["ARTonaut","Street art","Canvas","UV-reactive"],"sourceUrl":"https://www.artevistas.eu/product/mark-rox-artonaut-18/","featured":false,"published":true,"version":1}],"settings":{"name":"Mark Rox","headlineEn":"Art.\nOutside\nthe orbit.","headlineRu":"Искусство.\nВне\nорбиты.","introEn":"Street energy. Freedom of form. Paintings and sculptures that shift the way we see the world.","introRu":"Энергия улиц. Свобода формы. Живопись и скульптура, которые меняют привычный взгляд на мир.","bioEn":"Mark Rox (b. 1993, Baltiysk, Russia) is a multidisciplinary artist working across street art, graffiti, painting, sculpture, digital art and 3D illusions. His practice began in 2008 and has since crossed borders, from Russia to Barcelona, Amsterdam and Riyadh.\n\nHe founded the graffiti team From the Heart and the wall-painting company Roxart, and won the Chetrapromart graffiti competition in 2016. He is a permanent artist at Artevistas Gallery in Barcelona.","bioRu":"Марк Рокс (род. 1993, Балтийск, Россия) — мультидисциплинарный художник, работающий со стрит-артом, граффити, живописью, скульптурой, цифровым искусством и 3D-иллюзиями. Начав практику в 2008 году, он вышел за географические границы: его работы представлены от России до Барселоны, Амстердама и Эр-Рияда.\n\nОснователь граффити-команды From the Heart и компании по росписи стен Roxart, победитель конкурса Chetrapromart 2016 года. Постоянный художник Artevistas Gallery в Барселоне.","moreEn":"He founded the From the Heart graffiti team and the wall-painting company Roxart, and won the Chetrapromart graffiti competition in 2016. His projects have reached Barcelona, Amsterdam and Riyadh, among other cities. Mark Rox is a permanent artist at Artevistas Gallery.","moreRu":"Основал граффити-команду «От сердца» и компанию Roxart, а в 2016 году победил в конкурсе «Четрапромарт». Среди городов его проектов — Барселона, Амстердам и Эр-Рияд. Mark Rox — постоянный художник Artevistas Gallery.","portrait":"https://www.artevistas.eu/wp-content/uploads/2025/01/Foto-de-artista-1.jpg","email":"","instagram":"https://www.instagram.com/pop.art.pov","telegram":"","heroId":"piece-of-art","source":"https://www.artevistas.eu/artist/mark-rox-pop-art-pov/"},"sourceDate":"2026-09-08"};window.ASSETS={};'use strict';

function faq(){const pairs=[[tr('How do I acquire a work?','Как приобрести работу?'),tr('Open an artwork, add it to your selection and send an enquiry. Availability, final price and delivery are agreed before any payment. The website does not charge your card.','Откройте карточку, добавьте работу в список и отправьте запрос. Наличие, окончательная цена и доставка согласуются до оплаты. Сайт не списывает деньги с карты.')],[tr('Can I see the details?','Можно рассмотреть детали?'),tr('Each artwork has a gallery of original photographs. Open an image, move between angles and zoom in. Ask for additional photographs in your enquiry.','В каждой карточке есть галерея оригинальных фотографий. Откройте снимок, переключайтесь между ракурсами и увеличивайте изображение. Дополнительные фотографии можно запросить в заявке.')],[tr('What about shipping?','Как устроена доставка?'),tr('Share your destination city in the enquiry. Packaging, shipping cost, insurance and any customs charges need individual confirmation. No delivery charges are included automatically.','Укажите город назначения в заявке. Упаковка, стоимость перевозки, страхование и возможные пошлины согласуются отдельно. Доставка не включается автоматически.')],[tr('Is a sold work still available?','Можно купить проданную работу?'),tr('No. Sold works remain in the archive and cannot be added to a purchase enquiry. You can discuss a different work or a new project through the contact form.','Нет. Проданные работы остаются в архиве, но не добавляются в заявку на покупку. Через форму связи можно обсудить другую работу или новый проект.')]];return `<section class="collector section"><div class="wrap collector-grid"><div><p class="eyebrow">${tr('FOR COLLECTORS','КОЛЛЕКЦИОНЕРАМ')}</p><h2>${tr('Good art.<br>Clear answers.','Искусство.<br>Без лишних вопросов.')}</h2></div><div class="faq">${pairs.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section>`}
const cta=()=>`<section class="wrap cta"><div><p class="eyebrow">${tr('ACQUISITIONS / PROJECTS / COLLABORATIONS','ПРИОБРЕТЕНИЕ / ПРОЕКТЫ / СОТРУДНИЧЕСТВО')}</p><h2>${tr('Let’s make it real.','Давайте воплотим идею.')}</h2></div>${link('/contact',icon('arrow')+`<span class="sr">${tr('Contact the studio','Связаться')}</span>`,'icon')}</section>`;
function home(){const s=data.settings,heroList=[published().find(p=>p.id===s.heroId),...published().filter(p=>p.id!==s.heroId&&p.featured)].filter(Boolean).slice(0,3),p=heroList[heroIndex%Math.max(1,heroList.length)];return `<main id="main"><section class="wrap hero"><div class="hero-kicker"><p class="eyebrow"><span class="dot"></span>${tr('MARK ROX / ARTIST & CREATOR','MARK ROX / ХУДОЖНИК')}</p><p class="eyebrow muted">${tr('A DIFFERENT POINT OF VIEW','ДРУГОЙ ВЗГЛЯД')}</p></div><div class="hero-grid"><div class="hero-copy"><h1>${e(local(s,'headline'))}</h1><p class="hero-desc">${e(local(s,'intro'))}</p><div class="actions">${link('/works',tr('Explore works','Смотреть работы')+icon('arrow'),'btn')}${link('/artist',tr('Meet the artist','О художнике'),'textlink')}</div><p class="signature">${tr('Street roots. No boundaries.','Уличные корни. Без границ.')}<br>${tr('Creating since 2008.','В искусстве с 2008 года.')}</p></div>${p?`<div class="hero-frame">${link('/work/'+p.id,media(p.images[0],p.title,{eager:true,sold:p.availability==='sold'}),'media-link')}<div class="hero-caption"><div><strong>${e(p.title)}</strong><p>${cat(p.category)} · ${p.year||''}</p></div><div class="hero-controls"><span aria-live="polite">${String(heroIndex%heroList.length+1).padStart(2,'0')} / ${String(heroList.length).padStart(2,'0')}</span><button class="icon" data-action="hero-next" aria-label="${tr('Next featured work','Следующая работа')}">${icon('right')}</button></div></div></div>`:''}</div><div class="hero-bottom"><a href="${e(s.source)}" target="_blank" rel="noopener noreferrer">${tr('Represented by Artevistas Gallery, Barcelona','Представлен в Artevistas Gallery, Барселона')} ↗</a><span>SCULPTURE / PAINTING / STREET ART</span>${link('/works',tr('Discover','Смотреть')+icon('down'))}</div></section><section class="wrap section rule"><div class="section-head"><div><p class="eyebrow">01 / ${tr('THE COLLECTION','КОЛЛЕКЦИЯ')}</p><h2>${tr('Selected works','Избранные работы')}<sup class="num">${String(published().length).padStart(2,'0')}</sup></h2></div>${link('/works',tr('View all works','Все работы')+icon('arrow'),'textlink')}</div><div class="works">${published().filter(p=>p.featured).slice(0,6).map(workCard).join('')}</div></section><section class="manifesto"><div class="wrap manifesto-grid"><p class="eyebrow">02 / ARTonaut</p><div><h2>${tr('Not just an object.\nA whole new orbit.','Не просто объект.\nСвоя орбита.')}</h2><p>${tr('From the energy of the street to a sculptural form. Explore the ARTonaut collection, one detail at a time.','От энергии улиц к скульптурной форме. Откройте коллекцию ARTonaut, рассматривая каждую деталь.')}</p>${link('/works?type=sculpture',tr('Explore ARTonaut','Коллекция ARTonaut')+icon('arrow'),'textlink')}</div></div></section><section class="wrap section about"><figure>${media(s.portrait,'Mark Rox',{cls:'portrait'})}<figcaption class="caption"><span>Mark Rox</span><span>${tr('Photo: Artevistas Gallery','Фото: Artevistas Gallery')}</span></figcaption></figure><div><p class="eyebrow">03 / ${tr('BEHIND THE WORK','ЗА РАБОТАМИ')}</p><h2>${tr('From the street.<br>Beyond the frame.','С улицы.<br>За пределы рамы.')}</h2><p>${e(local(s,'bio'))}</p>${link('/artist',tr('The story of Mark Rox','История Mark Rox')+icon('arrow'),'textlink')}</div></section>${faq()}${cta()}</main>`}
function catalogue(params){const requested=params.get('type');if(requested&&['sculpture','painting','sold'].includes(requested))filter=requested;let ps=published();const tabs=[['all',tr('All works','Все работы')],['sculpture',tr('Sculptures','Скульптуры')],['painting',tr('Paintings','Живопись')],['sold',tr('Archive','Архив')]];const count=f=>ps.filter(p=>f==='all'||(f==='sold'?p.availability==='sold':p.category===f)).length;const tags=[...new Set(ps.flatMap(p=>p.tags||[]))].slice(0,12);let found=ps.filter(p=>(filter==='all'||(filter==='sold'?p.availability==='sold':p.category===filter))&&(!tagFilter||(p.tags||[]).includes(tagFilter))&&[p.title,cat(p.category),...(p.tags||[])].join(' ').toLowerCase().includes(search.toLowerCase()));found.sort((a,b)=>{const aS=a.availability==='sold'?1:0,bS=b.availability==='sold'?1:0;if(aS!==bS)return aS-bS;if(sort==='price-asc')return(a.price??Infinity)-(b.price??Infinity);if(sort==='price-desc')return(b.price??-Infinity)-(a.price??-Infinity);if(sort==='newest')return(b.year||0)-(a.year||0);return 0;});return `<main id="main" class="wrap catalogue"><div class="page-head"><p class="eyebrow">THE ART OF MARK ROX</p><h1>${tr('The collection.','Коллекция.')}<sup class="num">${String(ps.length).padStart(2,'0')}</sup></h1><p>${tr('Paintings, sculptures, a different point of view. Find the work that stays with you.','Живопись, скульптура, другой взгляд на привычное. Найдите работу, которая останется с вами.')}</p></div><div class="filters"><div class="tabs" aria-label="${tr('Categories','Категории')}">${tabs.map(([v,n])=>`<button class="tab ${filter===v?'active':''}" data-action="filter" data-filter="${v}" aria-pressed="${filter===v}">${n}<sup>${count(v)}</sup></button>`).join('')}</div><div class="filter-right"><label><span class="sr">${tr('Search works','Поиск работ')}</span><input class="search" id="catalogue-search" placeholder="${tr('Search works or tags','Название или тег')}" value="${e(search)}" type="search"></label><label><span class="sr">${tr('Sort','Сортировка')}</span><select id="catalogue-sort">${[['curated',tr('Curated selection','Порядок галереи')],['newest',tr('Newest first','Сначала новые')],['price-asc',tr('Price: low to high','Цена: по возрастанию')],['price-desc',tr('Price: high to low','Цена: по убыванию')]].map(([v,n])=>`<option value="${v}" ${v===sort?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div class="tag-row">${tags.map(t=>`<button class="tag ${tagFilter===t?'active':''}" data-action="tag" data-tag="${e(t)}" aria-pressed="${tagFilter===t}">${e(t)}</button>`).join('')}</div><div id="catalogue-results">${found.length?`<div class="works">${found.map(workCard).join('')}</div>`:empty(tr('No works found.','Работы не найдены.'),tr('Try another category, tag or title.','Попробуйте другую категорию, тег или название.'),`<button class="btn secondary" data-action="clear-filters">${tr('Clear filters','Сбросить фильтры')}</button>`)}</div></main>`}
const empty=(title,text,button='')=>`<div class="empty"><h2>${title}</h2><p>${text}</p>${button}</div>`;
function productPage(id){const p=published().find(x=>x.id===id);if(!p)return notFound();const disabled=['sold','reserved'].includes(p.availability);return `<main id="main" class="wrap"><div class="crumb">${link('/',tr('Home','Главная'))}<span>/</span>${link('/works',tr('Works','Работы'))}<span>/</span><span>${e(p.title)}</span></div><div class="product"><div><button class="main-photo" data-action="lightbox" data-id="${e(p.id)}" aria-label="${tr('Open image gallery','Открыть галерею')}">${media(p.images[0],p.title,{eager:true,sold:p.availability==='sold'})}<span class="sr">${tr('Zoom photograph','Увеличить фото')}</span></button><div class="thumbs">${p.images.map((u,i)=>`<button class="thumb ${i===0?'active':''}" data-action="thumbnail" data-index="${i}" data-id="${e(p.id)}" aria-label="${tr('View','Ракурс')} ${i+1}" aria-pressed="${i===0}"><span>${i+1}</span><img src="${e(asset(safeImage(u)))}" alt="${e(p.title)} — ${i+1}"></button>`).join('')}</div><p class="small muted" style="margin-top:16px">${tr('Click an image to open. Zoom in to explore the details.','Нажмите на фото, чтобы открыть его и рассмотреть детали.')}</p></div><div class="product-info"><p class="eyebrow">MARK ROX / ${cat(p.category).toUpperCase()}</p><h1>${e(p.title)}</h1><p class="product-price">${p.price!==null&&p.price!==undefined?e(money(p.price))+(p.availability==='sold'?' <span class="muted" style="font-size:0.65em">· '+tr('Sold','Продано')+'</span>':''):tr('Price on request','Цена по запросу')}</p><p class="availability"><span class="dot"></span>${e(labels[p.availability]?.())}</p><p class="description">${e(local(p,'description'))}</p><dl class="specs">${[[tr('Medium','Материал'),local(p,'medium')],[tr('Dimensions','Размер'),p.dimensions],[tr('Year','Год'),p.year],[tr('Reference','Артикул'),p.sku]].filter(x=>x[1]).map(([a,b])=>`<div><dt>${a}</dt><dd>${e(b)}</dd></div>`).join('')}</dl><div class="actions">${disabled?link('/contact?subject='+encodeURIComponent(p.title),tr('Discuss a similar work','Обсудить другую работу')+icon('arrow'),'btn'):`<button class="btn" data-action="enquire" data-id="${e(p.id)}">${tr('Enquire about this work','Запросить работу')}${icon('arrow')}</button><button class="btn secondary ${saved.includes(p.id)?'selected':''}" data-action="save" data-id="${e(p.id)}">${icon(saved.includes(p.id)?'check':'plus')}${saved.includes(p.id)?tr('Selected','В списке'):tr('Select','В список')}</button>`}</div><p class="product-note">${tr('An enquiry, not a payment. Availability, final price and delivery are confirmed personally.','Это запрос, не оплата. Наличие, окончательная цена и доставка подтверждаются при ответе.')}</p><div class="product-tags">${(p.tags||[]).map(t=>`<span>${e(t)}</span>`).join('')}</div>${p.sourceUrl?`<details class="source"><summary>${tr('Artwork information & source','Информация о работе и источник')}</summary><p>${tr('Specifications and listed prices are from Artevistas Gallery, reviewed 8 September 2026. The source pages can change. Sold status follows the individual artwork page where listings conflict. Please confirm availability before purchase.','Характеристики и цены — из Artevistas Gallery, проверены 8 сентября 2026. Источники могут меняться. При расхождении статусов использована отдельная карточка работы. Наличие перед покупкой нужно подтвердить.')}</p><a href="${e(safeExternal(p.sourceUrl))}" target="_blank" rel="noopener noreferrer">Artevistas Gallery ↗</a></details>`:''}</div></div><section class="section rule"><div class="section-head"><h2>${tr('Keep exploring.','Продолжить знакомство.')}</h2>${link('/works',tr('All works','Все работы')+icon('arrow'),'textlink')}</div><div class="works">${published().filter(x=>x.id!==id).slice(0,3).map(workCard).join('')}</div></section></main>`}
function artist(){const s=data.settings;return `<main id="main"><div class="wrap page-head"><p class="eyebrow">BEHIND THE WORK</p><h1>${tr('A different<br>point of view.','Другой взгляд<br>на привычное.')}</h1></div><section class="wrap about section" style="padding-top:16px"><figure>${media(s.portrait,'Mark Rox',{cls:'portrait',eager:true})}<figcaption class="caption">Mark Rox<span>Artevistas Gallery</span></figcaption></figure><div><p class="eyebrow">${tr('ARTIST / CREATOR / EXPLORER','ХУДОЖНИК / СОЗДАТЕЛЬ / ИССЛЕДОВАТЕЛЬ')}</p><h2>${e(s.name)}</h2><p>${e(local(s,'bio'))}</p><p>${e(local(s,'more'))}</p><a class="textlink" href="${e(s.source)}" target="_blank" rel="noopener noreferrer">${tr('Artist profile at Artevistas','Профиль в Artevistas')} ${icon('arrow')}</a></div></section><section class="wrap section rule"><div class="artist-text"><h2>${tr('One artist. Many dimensions.','Один художник. Много измерений.')}</h2><p>${tr('A practice spanning urban spaces, painted surfaces and sculptural objects. The website brings these different dimensions together without losing sight of the work itself.','Практика, объединяющая городские пространства, живопись и скульптурные объекты. Здесь разные направления собраны вместе, но в центре внимания всегда остаётся сама работа.')}</p></div><div class="practice">${[['01',tr('Street art','Стрит-арт'),tr('The city as a space for experimentation. Graffiti and 3D illusions form part of the artist’s visual language.','Город как пространство эксперимента. Граффити и 3D-иллюзии — часть визуального языка художника.')],['02',tr('Painting','Живопись'),tr('Canvas, colour and layered perception. Explore paintings documented by Artevistas Gallery.','Холст, цвет и многослойное восприятие. Живопись, представленная в каталоге Artevistas Gallery.')],['03','ARTonaut',tr('A sculptural collection. Explore the acrylic-cement objects from multiple angles.','Коллекция скульптур. Объекты из акрилового цемента, которые можно рассмотреть с разных ракурсов.')]].map(([n,t,d])=>`<div><p class="eyebrow">${n}</p><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></section>${cta()}</main>`}
function field(name,label,value='',options={}){const {type='text',wide=false,required=false,placeholder='',readonly=false,max=300}=options;return `<div class="field ${wide?'wide':''}"><label for="f-${e(name)}">${label}${required?' *':''}</label>${type==='textarea'?`<textarea id="f-${e(name)}" name="${e(name)}" maxlength="${max}" ${required?'required':''} placeholder="${e(placeholder)}">${e(value)}</textarea>`:`<input id="f-${e(name)}" name="${e(name)}" type="${type}" value="${e(value)}" ${required?'required':''} ${readonly?'readonly':''} maxlength="${max}" ${type==='number'?'min="0" step="any"':''} placeholder="${e(placeholder)}">`}</div>`}
const selectField=(name,label,items,value,wide=false)=>`<div class="field ${wide?'wide':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${items.map(([k,v])=>`<option value="${e(k)}" ${k===value?'selected':''}>${e(v)}</option>`).join('')}</select></div>`;
function inquiryForm(kind='acquisition',subject=''){return `<form id="inquiry-form" class="formbox" data-submission="${uid()}">${demo?notice(tr('Preview only. This enquiry will be saved in this browser, not sent to the artist, Telegram or email. Use fictional contact details when testing.','Только демонстрация. Заявка сохранится в этом браузере, но не отправится художнику, в Telegram или на email. Для теста используйте вымышленные контакты.'),'warning'):!flags.inquiriesEnabled?notice(tr('Enquiries are not enabled yet. Contact the studio using the published contact details, if available.','Приём заявок пока не подключён. Используйте опубликованные контакты студии, если они доступны.'),'warning'):''}<div class="error" hidden role="alert"></div><div class="fields">${selectField('kind',tr('I am interested in','Меня интересует'),[['acquisition',tr('Acquiring a work','Приобретение работы')],['commission',tr('A custom project','Индивидуальная работа')],['collaboration',tr('A collaboration','Сотрудничество')]],kind,true)}${field('name',tr('Your name','Ваше имя'),'',{required:true,max:100,placeholder:tr('Your full name','Ваше имя')})}${field('email','Email','',{required:true,type:'email',max:254,placeholder:'you@example.com'})}${field('telegram',tr('Telegram (optional)','Telegram (необязательно)'),'',{max:33,placeholder:'@username'})}${field('city',tr('City / country (optional)','Город / страна (необязательно)'),'',{max:160,placeholder:tr('Your delivery destination','Куда доставить работу')})}${field('message',tr('Your message','Сообщение'),subject?tr('I would like to discuss: ','Хочу обсудить: ')+subject:'',{type:'textarea',wide:true,max:3000,placeholder:tr('Tell us about the work, your space or your idea.','Расскажите о работе, пространстве или идее.')})}</div><div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="check"><input type="checkbox" name="consent" required><span>${tr('I agree to the pro // --- MARKETING ANALYTICS MODULE ---
const ANALYTICS_KEY = 'mr-analytics-v1';
function getAnalytics() {
  const defaultData = {
    visitors: 0,
    pageviews: 0,
    sources: {},
    devices: {},
    funnel: { home: 0, catalogue: 0, product: 0, saved: 0, inquiryOpened: 0, inquirySent: 0 },
    artworkStats: {},
    counters: { yandexMetrika: '', googleAnalytics: '' }
  };
  try {
    const raw = localStorage.getItem(ANALYTICS_KEY);
    return raw ? { ...defaultData, ...JSON.parse(raw) } : defaultData;
  } catch {
    return defaultData;
  }
}

function saveAnalytics(an) {
  try { localStorage.setItem(ANALYTICS_KEY, JSON.stringify(an)); } catch {}
}

function initSessionTracker() {
  if (typeof window === 'undefined') return;
  try {
    if (!sessionStorage.getItem('mr-tracked-session')) {
      sessionStorage.setItem('mr-tracked-session', '1');
      const an = getAnalytics();
      an.visitors = (an.visitors || 0) + 1;
      const isMob = window.innerWidth <= 768;
      if (isMob) an.devices['Mobile (Смартфоны)'] = (an.devices['Mobile (Смартфоны)'] || 0) + 1;
      else an.devices['Desktop (Компьютеры)'] = (an.devices['Desktop (Компьютеры)'] || 0) + 1;
      const ref = (document.referrer || '').toLowerCase();
      const sp = new URLSearchParams(window.location.search);
      const utm = sp.get('utm_source');
      let src = 'Прямые заходы (Direct)';
      if (utm) src = 'Реклама: ' + utm;
      else if (ref.includes('instagram')) src = 'Instagram (@pop.art.pov)';
      else if (ref.includes('google')) src = 'Google / Поисковые запросы';
      else if (ref.includes('yandex')) src = 'Яндекс Поиск';
      else if (ref.includes('telegram') || ref.includes('t.me')) src = 'Telegram';
      else if (ref.includes('artevistas')) src = 'Artevistas Gallery (Барселона)';
      else if (ref.includes('tilda')) src = 'Tilda Platform';
      else if (ref) { try { src = new URL(ref).hostname; } catch {} }
      an.sources[src] = (an.sources[src] || 0) + 1;
      saveAnalytics(an);
    }
  } catch {}
}

function trackEvent(eventType, payload) {
  try {
    const an = getAnalytics();
    if (eventType === 'pageview') {
      an.pageviews = (an.pageviews || 0) + 1;
      const p = payload || path();
      if (p === '/') an.funnel.home = (an.funnel.home || 0) + 1;
      else if (p === '/works') an.funnel.catalogue = (an.funnel.catalogue || 0) + 1;
      else if (p.startsWith('/work/')) {
        an.funnel.product = (an.funnel.product || 0) + 1;
        const id = p.slice(6);
        if (!an.artworkStats[id]) an.artworkStats[id] = { views: 0, saves: 0, enquiries: 0, timeSec: 20 };
        an.artworkStats[id].views++;
      } else if (p === '/inquiry') {
        an.funnel.inquiryOpened = (an.funnel.inquiryOpened || 0) + 1;
      }
    } else if (eventType === 'save') {
      an.funnel.saved = (an.funnel.saved || 0) + 1;
      const id = payload;
      if (id) {
        if (!an.artworkStats[id]) an.artworkStats[id] = { views: 1, saves: 0, enquiries: 0, timeSec: 20 };
        an.artworkStats[id].saves++;
      }
    } else if (eventType === 'enquire') {
      const id = payload;
      if (id && an.artworkStats[id]) an.artworkStats[id].enquiries++;
    } else if (eventType === 'inquiry_sent') {
      an.funnel.inquirySent = (an.funnel.inquirySent || 0) + 1;
    }
    saveAnalytics(an);
  } catch {}
}

function exportAnalyticsCsv() {
  const an = getAnalytics();
  let csv = 'SEP=,\n';
  csv += '=== СВОДКА МАРКЕТИНГА (MARK ROX) ===\n';
  csv += 'Метрика,Значение\n';
  csv += 'Уникальные посетители,' + an.visitors + '\n';
  csv += 'Просмотры страниц,' + an.pageviews + '\n';
  csv += 'Ср. глубина просмотра,' + (an.pageviews / Math.max(1, an.visitors)).toFixed(2) + ' стр./визит\n';
  csv += 'Отказы (Bounce rate),' + (an.visitors ? ((Math.max(0, an.visitors - (an.funnel.catalogue || 0)) / an.visitors) * 100).toFixed(1) + '%' : '0.0%') + '\n';
  csv += 'Конверсия в интерес,' + (an.visitors ? ((an.funnel.saved / an.visitors) * 100).toFixed(1) : '0.0') + '%\n';
  csv += 'Конверсия в заявку,' + (an.visitors ? ((an.funnel.inquirySent / an.visitors) * 100).toFixed(1) : '0.0') + '%\n\n';

  csv += '=== ИСТОЧНИКИ ТРАФИКА И КАНАЛЫ ===\n';
  csv += 'Канал перехода,Визиты,Доля\n';
  const totalSrc = Object.values(an.sources).reduce((a, b) => a + b, 0);
  for (const [src, cnt] of Object.entries(an.sources)) {
    csv += `"${src}",${cnt},${((cnt / Math.max(1, totalSrc)) * 100).toFixed(1)}%\n`;
  }
  csv += '\n';

  csv += '=== ВОРОНКА КОНВЕРСИИ И ТОЧКИ ОТВАЛА ===\n';
  csv += 'Шаг воронки,Пользователей,Доля от входа,Потери на шаге\n';
  const f = an.funnel;
  csv += `"1. Вход на сайт",${f.home},100%,0%\n`;
  csv += `"2. Просмотр каталога работ",${f.catalogue},${f.home?((f.catalogue/f.home)*100).toFixed(1):'0.0'}%,${f.home?(100-(f.catalogue/f.home)*100).toFixed(1):'0.0'}%\n`;
  csv += `"3. Изучение карточки работы",${f.product},${f.home?((f.product/f.home)*100).toFixed(1):'0.0'}%,${f.catalogue?(((f.catalogue-f.product)/f.catalogue)*100).toFixed(1):'0.0'}%\n`;
  csv += `"4. Добавление в подборку",${f.saved},${f.home?((f.saved/f.home)*100).toFixed(1):'0.0'}%,${f.product?(((f.product-f.saved)/f.product)*100).toFixed(1):'0.0'}%\n`;
  csv += `"5. Открытие формы заявки",${f.inquiryOpened},${f.home?((f.inquiryOpened/f.home)*100).toFixed(1):'0.0'}%,${f.saved?(((f.saved-f.inquiryOpened)/f.saved)*100).toFixed(1):'0.0'}%\n`;
  csv += `"6. Отправка запроса на покупку",${f.inquirySent},${f.home?((f.inquirySent/f.home)*100).toFixed(1):'0.0'}%,${f.inquiryOpened?(((f.inquiryOpened-f.inquirySent)/f.inquiryOpened)*100).toFixed(1):'0.0'}%\n\n`;

  csv += '=== РЕЙТИНГ ПОПУЛЯРНОСТИ КАРТОЧЕК РАБОТ ===\n';
  csv += 'Название работы,Артикул,Категория,Цена EUR,Статус,Просмотры,В подборках,Запросы,Ср. время (сек),Конверсия %\n';
  const ps = data.products.map(p => {
    const st = an.artworkStats[p.id] || { views: 0, saves: 0, enquiries: 0, timeSec: 0 };
    return { ...p, ...st };
  }).sort((a, b) => b.views - a.views);

  for (const p of ps) {
    const cr = p.views > 0 ? ((p.saves / p.views) * 100).toFixed(1) : '0.0';
    csv += `"${p.title}","${p.sku||''}","${p.category}","${p.price||''}","${p.availability}",${p.views},${p.saves},${p.enquiries},${p.timeSec},${cr}%\n`;
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mark-rox-marketing-analytics-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openModal(title,body){const d=$('#dialog');d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon" data-action="close-modal" aria-label="${tr('Close','Закрыть')}">${icon('close')}</button></div><div class="modal-body">${body}</div>`;d.setAttribute('aria-labelledby','modal-title');if(!d.open)d.showModal();document.body.style.overflow='hidden';bindImages(d)}
function closeModal(){const d=$('#dialog');d.close();document.body.style.overflow=''}
let lightboxProduct=null,lightboxIndex=0;function lightbox(id,index=0){const p=published().find(x=>x.id===id);if(!p)return;lightboxProduct=p;lightboxIndex=(index+p.images.length)%p.images.length;openModal(e(p.title),`<div class="lightbox-stage"><button class="icon" data-action="lightbox-prev" aria-label="${tr('Previous photo','Предыдущее фото')}">${icon('left')}</button><div data-action="zoom" tabindex="0" role="button" aria-label="${tr('Toggle zoom','Увеличить или уменьшить')}">${media(p.images[lightboxIndex],p.title+' — '+(lightboxIndex+1),{eager:true})}</div><button class="icon" data-action="lightbox-next" aria-label="${tr('Next photo','Следующее фото')}">${icon('right')}</button></div><div class="lightbox-foot"><span aria-live="polite">${String(lightboxIndex+1).padStart(2,'0')} / ${String(p.images.length).padStart(2,'0')}</span><button data-action="zoom">${tr('Zoom 1× / 1.8×','Масштаб 1× / 1,8×')}</button><a href="${e(asset(safeImage(p.images[lightboxIndex])))}" target="_blank" rel="noopener noreferrer">${tr('Open original ↗','Открыть оригинал ↗')}</a></div>`)}
function editorImages(){return `<div class="upload-list">${editor.images.map((u,i)=>`<div class="upload-tile">${media(u,String(i+1),{cls:'mini'})}<button class="icon" type="button" data-action="remove-editor-image" data-index="${i}" aria-label="${tr('Remove image','Удалить фото')} ${i+1}">${icon('close')}</button><button class="cover-btn" type="button" data-action="cover-image" data-index="${i}">${i===0?tr('Cover','Обложка'):tr('Make cover','На обложку')}</button></div>`).join('')}</div>`}
function productEditor(id){const current=data.products.find(p=>p.id===id);editing=!!current;editor=current?structuredClone(current):{id:'work-'+Date.now().toString(36),title:'',category:'sculpture',availability:'on_request',price:null,year:new Date().getFullYear(),dimensions:'',mediumEn:'',mediumRu:'',descriptionEn:'',descriptionRu:'',images:[],tags:[],sku:'',sourceUrl:'',published:true,featured:false,version:0};const p=editor;openModal(tr(editing?'Edit artwork':'Add artwork',editing?'Редактировать работу':'Добавить работу'),`<form id="product-form"><div class="error" role="alert" hidden></div><div class="fields">${field('title',tr('Artwork title','Название работы'),p.title,{required:true,wide:true,max:150})}${field('id',tr('URL slug','Адрес карточки'),p.id,{required:true,readonly:editing,max:100})}${selectField('category',tr('Category','Категория'),[['sculpture',cat('sculpture')],['painting',cat('painting')],['other',cat('other')]],p.category)}${field('price',tr('Price · EUR (blank = on request)','Цена · EUR (пусто = по запросу)'),p.price??'',{type:'number'})}${selectField('availability',tr('Availability','Наличие'),Object.keys(labels).map(k=>[k,labels[k]()]),p.availability)}${field('year',tr('Year','Год'),p.year??'',{type:'number'})}${field('dimensions',tr('Dimensions','Размеры'),p.dimensions,{max:150})}${field('sku',tr('SKU / reference','Артикул'),p.sku,{max:100})}${field('tags',tr('Tags · comma-separated','Теги · через запятую'),(p.tags||[]).join(', '),{max:600,placeholder:'ARTonaut, Sculpture, Mixed media'})}<div class="field wide"><label for="artwork-upload">${tr('Photographs · up to 8','Фотографии · до 8')}</label><div class="upload-area">${tr('The first photo is the card cover. Upload JPG, PNG or WebP. Original input up to 12 MB; images are resized to 1800 px.','Первое фото — обложка карточки. Загружайте JPG, PNG или WebP. Исходник до 12 МБ; фото уменьшается до 1800 px.')}<input id="artwork-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div id="editor-images">${editorImages()}</div><div class="help" id="upload-status" aria-live="polite"></div></div>${field('mediumEn','Medium · English',p.mediumEn,{max:300,wide:true})}${field('descriptionEn','Description · English',p.descriptionEn,{type:'textarea',wide:true,max:6000})}<details class="details-lang"><summary>Русская версия / Russian translation</summary><div class="fields">${field('mediumRu','Материал · Русский',p.mediumRu,{wide:true,max:300})}${field('descriptionRu','Описание · Русский',p.descriptionRu,{type:'textarea',wide:true,max:6000})}</div></details>${field('sourceUrl',tr('Source URL (optional)','Источник (необязательно)'),p.sourceUrl,{type:'url',wide:true,max:2048})}<label class="check inline"><input type="checkbox" name="published" ${p.published?'checked':''}>${tr('Publish in catalogue','Опубликовать в каталоге')}</label><label class="check inline"><input type="checkbox" name="featured" ${p.featured?'checked':''}>${tr('Feature on homepage','Показывать на главной')}</label></div><div class="modal-actions">${editing?`<button class="btn danger" type="button" data-action="delete-product" data-id="${e(p.id)}">${icon('trash')}${tr('Delete','Удалить')}</button>`:`<button class="btn secondary" type="button" data-action="close-modal">${tr('Cancel','Отмена')}</button>`}<button class="btn" type="submit">${tr('Save artwork','Сохранить работу')}${icon('check')}</button></div></form>`)}
async function fileImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12*1024*1024)throw Error(tr('Use JPG, PNG or WebP up to 12 MB.','Используйте JPG, PNG или WebP до 12 МБ.'));const bitmap=await createImageBitmap(file);const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/webp',.88)}
function showError(form,error){const box=$('.error',form);if(box){box.textContent=error.message||String(error);box.hidden=false;box.scrollIntoView({block:'nearest',behavior:'smooth'})}else toast(error.message||String(error))}
function selection(id,removeOnly=false){if(saved.includes(id)||removeOnly)saved=saved.filter(x=>x!==id);else{const p=published().find(x=>x.id===id);if(!p)return;if(saved.length>=20){toast(tr('Select up to 20 works.','Можно выбрать до 20 работ.'));return}saved.push(id)}try{put('mr-selection',saved)}catch(err){toast(err.message)}render()}
async function refreshAdmin(){if(!demo){const result=await api('/api/admin/state');data={...data,...result};flags={...flags,...result.flags}}render()}
function exportJson(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async ev=>{const route=ev.target.closest('a[data-route]');if(route&&!ev.ctrlKey&&!ev.metaKey&&!ev.shiftKey&&!ev.altKey){ev.preventDefault();const href=route.getAttribute('href');if($('#dialog').open)closeModal();if(href.includes('/works')){const u=href.replace(/^#/,'');if(!u.includes('?')){filter='all';tagFilter='';search=''}}go(href.replace(/^#/,''));return}const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;try{if(a==='language'){lang=lang==='en'?'ru':'en';try{put('mr-language',lang)}catch{}if($('#dialog').open)closeModal();render()}else if(a==='menu'){menu=!menu;render()}else if(a==='hero-next'){heroIndex++;render()}else if(a==='save'||a==='remove'){selection(id,a==='remove');if(a==='save')trackEvent('save',id);toast(tr(a==='remove'?'Removed from selection.':'Selection updated.',a==='remove'?'Убрано из списка.':'Список обновлён.'))}else if(a==='enquire'){if(!saved.includes(id)){selection(id)}trackEvent('enquire',id);go('/inquiry')}else if(a==='filter'){filter=el.dataset.filter;tagFilter='';const p='/works';if(demo)history.replaceState({},'','#'+p);else history.replaceState({},'',p);render()}else if(a==='tag'){tagFilter=tagFilter===el.dataset.tag?'':el.dataset.tag;render()}else if(a==='clear-filters'){filter='all';tagFilter='';search='';go('/works')}else if(a==='lightbox'){lightbox(id,Number(el.dataset.index||0))}else if(a==='thumbnail'){const p=published().find(x=>x.id===id),i=Number(el.dataset.index);$('.main-photo').innerHTML=media(p.images[i],p.title+' — '+(i+1),{eager:true,sold:p.availability==='sold'});$('.main-photo').dataset.index=i;$$('.thumb').forEach(x=>{x.classList.toggle('active',Number(x.dataset.index)===i);x.setAttribute('aria-pressed',String(Number(x.dataset.index)===i))});bindImages()}else if(a==='close-modal'){closeModal()}else if(a==='lightbox-prev'){lightbox(lightboxProduct.id,lightboxIndex-1)}else if(a==='lightbox-next'){lightbox(lightboxProduct.id,lightboxIndex+1)}else if(a==='zoom'){$('.lightbox-stage .media')?.classList.toggle('zoomed')}else if(a==='new-product'){productEditor()}else if(a==='edit-product'){productEditor(id)}else if(a==='remove-editor-image'){editor.images.splice(Number(el.dataset.index),1);$('#editor-images').innerHTML=editorImages();bindImages($('#dialog'))}else if(a==='cover-image'){const i=Number(el.dataset.index),[img]=editor.images.splice(i,1);editor.images.unshift(img);$('#editor-images').innerHTML=editorImages();bindImages($('#dialog'))}else if(a==='delete-product'){if(!confirm(tr('Delete this artwork? This removes it from the catalogue.','Удалить работу? Она исчезнет из каталога.')))return;await api('/api/admin/products/'+id,'DELETE');if(demo){}else data.products=data.products.filter(x=>x.id!==id);closeModal();render();toast(tr('Artwork deleted.','Работа удалена.'))}else if(a==='logout'){if(!demo)await api('/api/admin/logout','POST',{});session=null;render()}else if(a==='export-analytics'){exportAnalyticsCsv()}else if(a==='reset-analytics'){if(confirm(tr('Reset all analytics counters to zero?','Сбросить все счётчики аналитики в ноль?'))){localStorage.removeItem('mr-analytics-v1');sessionStorage.removeItem('mr-tracked-session');toast(tr('Analytics reset to zero.','Счётчики аналитики сброшены в 0.'));render()}}else if(a==='export'){exportJson('mark-rox-catalogue.json',{products:data.products,settings:data.settings})}else if(a==='refresh-admin'){await refreshAdmin()}else if(a==='delete-request'){if(!confirm(tr('Permanently delete this enquiry and its contact details? External email/Telegram copies must be removed separately.','Навсегда удалить заявку и контакты? Копии в почте/Telegram нужно удалить отдельно.')))return;await api('/api/admin/inquiries/'+id,'DELETE');await refreshAdmin()}else if(a==='retry'){await api('/api/admin/inquiries/'+id+'/retry','POST',{});await refreshAdmin();toast(tr('Delivery queued again.','Отправка снова поставлена в очередь.'))}else if(a==='clear-local'){saved=[];try{put('mr-selection',[])}catch{}toast(tr('Your selection is cleared.','Ваш выбор очищен.'));render()}}catch(err){if($('#dialog').open)showError($('#dialog'),err);else toast(err.message)}});
let searchTimer;document.addEventListener('input',ev=>{if(ev.target.id==='catalogue-search'||ev.target.id==='admin-search'){clearTimeout(searchTimer);const target=ev.target.id;searchTimer=setTimeout(()=>{const value=ev.target.value,position=ev.target.selectionStart;if(target==='catalogue-search')search=value;else adminSearch=value;render();const el=$('#'+target);el?.focus();try{el.setSelectionRange(position,position)}catch{}},180)}});
document.addEventListener('change',async ev=>{const el=ev.target;try{if(el.id==='catalogue-sort'){sort=el.value;render()}else if(el.dataset.requestStatus){await api('/api/admin/inquiries/'+el.dataset.requestStatus,'PATCH',{status:el.value});await refreshAdmin()}else if(el.id==='artwork-upload'){const files=[...el.files];if(editor.images.length+files.length>8)throw Error(tr('Maximum 8 photos per artwork.','Максимум 8 фото на работу.'));const form=$('#product-form'),submit=$('button[type="submit"]',form);submit.disabled=true;$('#upload-status').textContent=tr('Processing photographs…','Обрабатываем фотографии…');try{for(const f of files){const image=await fileImage(f);const result=await api('/api/admin/upload','POST',{image});editor.images.push(result.url)}$('#editor-images').innerHTML=editorImages();bindImages($('#dialog'));$('#upload-status').textContent=tr('Photos ready. Save the artwork to publish.','Фото готовы. Сохраните карточку для публикации.')}finally{submit.disabled=false;el.value=''}}else if(el.id==='portrait-upload'){el.disabled=true;try{const result=await api('/api/admin/upload','POST',{image:await fileImage(el.files[0])});$('#f-portrait').value=result.url;toast(tr('Portrait ready. Save site details.','Портрет готов. Сохраните данные сайта.'))}finally{el.disabled=false;el.value=''}}}catch(err){if(el.closest('form'))showError(el.closest('form'),err);else toast(err.message)}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['login-form','inquiry-form','product-form','settings-form','account-form'].includes(form.id))return;ev.preventDefault();const error=$('.error',form);if(error)error.hidden=true;const submit=$('button[type="submit"]',form);if(submit.disabled)return;submit.disabled=true;const fd=new FormData(form),body=Object.fromEntries(fd);try{if(form.id==='login-form'){if(demo){session={username:'Mark Rox / Studio Master',csrf:''}}else session=await api('/api/admin/login','POST',{username:body.username,password:body.password});if(!demo){const result=await api('/api/admin/state');data={...data,...result};flags={...flags,...result.flags}}go('/admin')}else if(form.id==='inquiry-form'){if(requestBusy)return;requestBusy=true;try{if(body.telegram&&!/^@[a-zA-Z0-9_]{5,32}$/.test(body.telegram))throw Error(tr('Telegram should be @username (5–32 letters, numbers or underscores).','Telegram должен быть @username (5–32 буквы, цифры или подчёркивания).'));if(body.name.trim().length<2)throw Error(tr('Please enter your name.','Введите имя.'));const productIds=activeSaved().map(x=>x.id);if(body.kind==='acquisition'&&!productIds.length)throw Error(tr('Please select a work first, or choose a project enquiry.','Сначала выберите работу или измените тип запроса на проект.'));lastSuccess=await api('/api/inquiries','POST',{...body,name:body.name.trim(),consent:fd.has('consent'),productIds,lang,submissionId:form.dataset.submission});saved=[];try{put('mr-selection',[])}catch{}go('/success')}finally{requestBusy=false}}else if(form.id==='product-form'){if(!editor.images.length)throw Error(tr('Add at least one photo.','Добавьте хотя бы одну фотографию.'));if(!/^[a-z0-9][a-z0-9-]{1,99}$/.test(body.id))throw Error(tr('URL slug: 2–100 lowercase letters, numbers and hyphens.','Адрес: 2–100 строчных латинских букв, цифр и дефисов.'));const price=body.price===''?null:Number(body.price),year=body.year===''?null:Number(body.year);if(price!==null&&(!Number.isFinite(price)||price<0))throw Error(tr('Check the price.','Проверьте цену.'));if(year!==null&&(!Number.isInteger(year)||year<1900||year>2100))throw Error(tr('Check the year.','Проверьте год.'));const p={...editor,...body,price,year,images:editor.images,tags:[...new Set(body.tags.split(',').map(x=>x.trim()).filter(Boolean))],published:fd.has('published'),featured:fd.has('featured')};await api('/api/admin/products'+(editing?'/'+editor.id:''),editing?'PUT':'POST',p);if(!demo){const result=await api('/api/admin/state');data={...data,...result}}closeModal();render();toast(tr('Artwork saved.','Работа сохранена.'))}else if(form.id==='analytics-config-form'){const an=getAnalytics();an.counters={yandexMetrika:body.yandexMetrika,googleAnalytics:body.googleAnalytics};saveAnalytics(an);toast(tr('Analytics settings saved!','Настройки аналитики сохранены!'));render()}else if(form.id==='settings-form'){await api('/api/admin/settings','PUT',body);if(!demo){const result=await api('/api/admin/state');data={...data,...result}}render();toast(tr('Site details saved.','Данные сайта сохранены.'))}else if(form.id==='account-form'){if(body.newPassword!==body.confirmPassword)throw Error(tr('Passwords do not match.','Пароли не совпадают.'));if(body.newPassword.length<12)throw Error(tr('Use at least 12 characters.','Используйте минимум 12 символов.'));await api('/api/admin/account','PUT',body);session=null;render();toast(tr('Credentials changed. Please sign in again.','Данные изменены. Войдите заново.'))}}catch(err){showError(form,err)}finally{submit.disabled=false}});
$('#dialog').addEventListener('close',()=>{document.body.style.overflow=''});$('#dialog').addEventListener('click',ev=>{if(ev.target.id==='dialog'){const r=ev.target.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',ev=>{if($('#dialog').open&&$('.lightbox-stage')){if(ev.key==='ArrowLeft'){ev.preventDefault();lightbox(lightboxProduct.id,lightboxIndex-1)}if(ev.key==='ArrowRight'){ev.preventDefault();lightbox(lightboxProduct.id,lightboxIndex+1)}if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset.action==='zoom'){ev.preventDefault();$('.lightbox-stage .media')?.classList.toggle('zoomed')}}});
window.addEventListener('hashchange',()=>{menu=false;render();window.scrollTo(0,0)});window.addEventListener('popstate',()=>{menu=false;render()});
async function init(){if(!demo){try{const result=await api('/api/catalog');data={...data,...result};flags={...flags,...result.flags};if(adminEntry||runtime.dev&&location.pathname==='/admin'){const auth=await api('/api/admin/session');if(auth.authenticated){session=auth;const a=await api('/api/admin/state');data={...data,...a};flags={...flags,...a.flags}}}}catch(err){loadError=tr('Live service is unavailable. The reference catalogue is shown read-only. Enquiries and editing are unavailable.','Сервер недоступен. Показан справочный каталог без возможности отправлять заявки и редактировать.');flags.inquiriesEnabled=false}}if(adminEntry&&!demo&&location.pathname==='/'){history.replaceState({},'','/admin')}render();window.MARKROX_READY=true}
init();
})();
